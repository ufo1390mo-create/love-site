<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برای تو ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #3a001f, #080008 70%);
    color: white;
    font-family: Tahoma, sans-serif;
}

#hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.heart {
    position: absolute;
    top: -50px;
    animation: fall linear forwards;
    filter: drop-shadow(0 0 10px #ff2f7d);
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: min(90%, 550px);
    padding: 35px 25px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 0 50px rgba(255,0,100,0.25);
    animation: appear 2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

h1 {
    font-size: 32px;
    margin-bottom: 25px;
    text-shadow: 0 0 20px #ff4f91;
}

#text {
    font-size: 19px;
    line-height: 2.2;
    min-height: 230px;
}

.love {
    margin-top: 20px;
    font-size: 30px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.2);
    }
}

button {
    margin-top: 25px;
    padding: 13px 30px;
    border: none;
    border-radius: 30px;
    background: #ff2676;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,38,118,.6);
}

button:active {
    transform: scale(.95);
}
</style>
</head>

<body>

<div id="hearts"></div>

<div class="container">
    <div class="card">

        <h1>برای قشنگ‌ترین آدم زندگی من ❤️</h1>

        <div id="text"></div>

        <div class="love">❤️ 🫂 ❤️</div>

        <button onclick="moreHearts()">یه عالمه قلب برای تو ❤️</button>

    </div>
</div>

<script>

const message = شاید فاصله بینمون زیاده،
ولی هیچ فاصله‌ای نمی‌تونه باعث بشه ازت دور بشم. 🫂

تو برای من فقط یه آدم معمولی نیستی...
تو همون کسی هستی که با یه پیامش
می‌تونه کل روزمو قشنگ کنه. 🥹❤️

دوستت دارم،
بیشتر از چیزی که بتونم با کلمه‌ها توضیحش بدم.

این همه قلب هم کمه برای تو ❤️;

let i = 0;

function typeText() {
    if (i < message.length) {
        document.getElementById("text").innerHTML +=
            message.charAt(i) === "\n"
            ? "<br>"
            : message.charAt(i);

        i++;
        setTimeout(typeText, 45);
    }
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";

    const hearts = ["❤️", "💗", "💖", "💕", "💘", "💝"];
    heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";
    heart.style.animationDuration = (3 + Math.random() * 4) + "s";

    document.getElementById("hearts").appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}

setInterval(createHeart, 120);

function moreHearts() {
    for (let i = 0; i < 60; i++) {
        setTimeout(createHeart, i * 30);
    }
}

typeText();

</script>

</body>
</html>
